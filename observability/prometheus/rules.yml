groups:
  - name: tripforge-api
    rules:
      - alert: TripForgeHighApi5xxRatio
        expr: |
          sum(rate(tripforge_http_server_requests{status_class="5xx"}[5m]))
          /
          clamp_min(sum(rate(tripforge_http_server_requests[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          service: tripforge-api
          severity: critical
        annotations:
          summary: TripForge API 5xx ratio is above 5 percent
          first_step: Inspect a representative request trace and correlated JSON error log.
      - alert: TripForgeHighApiLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(tripforge_http_server_duration_bucket[10m]))
          ) > 1
        for: 10m
        labels:
          service: tripforge-api
          severity: warning
        annotations:
          summary: TripForge API p95 latency is above one second
          first_step: Compare HTTP, PostgreSQL, S3, and provider spans in Jaeger.
  - name: tripforge-worker
    rules:
      - alert: TripForgeRepeatedWorkerFailures
        expr: sum(increase(tripforge_worker_jobs{outcome="failed"}[10m])) >= 3
        for: 1m
        labels:
          service: tripforge-worker
          severity: critical
        annotations:
          summary: TripForge worker jobs are repeatedly failing
          first_step: Find worker.job.failed logs and inspect the matching worker trace.
      - alert: TripForgeOutboxBacklogOld
        expr: tripforge_storage_outbox_oldest_age > 900
        for: 5m
        labels:
          service: tripforge-worker
          severity: warning
        annotations:
          summary: TripForge cleanup outbox oldest item exceeds 15 minutes
          first_step: Inspect dispatcher and cleanup job failures before checking S3.
  - name: tripforge-infrastructure
    rules:
      - alert: TripForgeDbPoolWaiting
        expr: tripforge_db_pool_waiting_requests > 0
        for: 5m
        labels:
          service: tripforge-api
          severity: warning
        annotations:
          summary: TripForge PostgreSQL pool has sustained waiters
          first_step: Inspect slow PostgreSQL spans and Stage 25 query plans.
      - alert: TripForgeRealtimePublisherFailures
        expr: increase(tripforge_realtime_events{event="publisher_failure"}[5m]) > 0
        for: 5m
        labels:
          service: tripforge-api
          severity: warning
        annotations:
          summary: TripForge realtime publisher failures are increasing
          first_step: Check realtime.redis.unavailable logs and Redis health.
