name: Release qualification

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Disposable runner load profile (no AWS/production actions)
        type: choice
        default: load
        options: [smoke, load, stress, soak]

permissions:
  contents: read

concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      LOAD_PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install and review
        run: |
          pnpm install --frozen-lockfile
          pnpm migrations:safety
          pnpm readiness:unit
          pnpm exec playwright install --with-deps chromium
      - name: Browser release qualification
        run: pnpm test:e2e
      - name: Local failure and logical recovery qualification
        run: pnpm readiness:test
      - name: Bounded selected load profile
        run: |
          export K6_BINARY="$(node scripts/readiness/install-k6.mjs)"
          pnpm perf:load "$LOAD_PROFILE"
      - name: Failure-only browser evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-browser-failures
          path: test-results/
          retention-days: 7
      - name: Non-sensitive compact qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-summaries
          path: |
            readiness-results/k6-*.json
            readiness-results/qualification.json
            readiness-results/capacity.json
            readiness-results/runtime-samples.json
            readiness-results/socket-soak.json
          retention-days: 14
