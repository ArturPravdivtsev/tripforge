name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: 24.21.0
  PNPM_VERSION: 12.3.4

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate and verify database artifacts
        run: |
          pnpm db:generate
          git diff --exit-code -- apps/api/drizzle
          pnpm db:check
      - name: Lint
        run: pnpm lint
      - name: Validate documentation and curated assets
        run: pnpm docs:check
      - name: Type-check
        run: pnpm typecheck
      - name: Run unit and component tests
        run: pnpm test
      - name: Run deterministic AI tests and evals
        run: |
          pnpm ai:test
          pnpm ai:eval
      - name: Enforce coverage gates
        run: pnpm test:coverage
      - name: Enforce accessibility tests
        run: pnpm test:a11y
      - name: Review destructive migration policy
        run: pnpm migrations:safety && pnpm readiness:unit
      - name: Build production applications
        run: pnpm build
      - name: Enforce bundle budgets
        run: pnpm perf:bundle:check
      - name: Validate observability configuration and tests
        run: |
          pnpm observability:config:check
          pnpm observability:test
      - name: Verify peer dependencies
        run: pnpm peers check
      - name: Test and audit workflow policy
        run: |
          pnpm ci:workflow:test
          pnpm ci:workflow:check
      - name: Verify source remains unchanged
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Summarize quality
        if: ${{ always() }}
        run: echo "### Quality — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: tripforge
          POSTGRES_PASSWORD: tripforge
          POSTGRES_DB: tripforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tripforge -d tripforge"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://tripforge:tripforge@127.0.0.1:5432/tripforge
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply complete migration chain twice
        run: |
          pnpm db:migrate
          pnpm db:migrate
      - name: Verify migration journal and pg_trgm
        run: node scripts/ci/verify-migrations.mjs
      - name: Summarize database gate
        if: ${{ always() }}
        run: echo "### Database — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Testcontainers integration suite
        run: pnpm ci:integration
      - name: Summarize integration gate
        if: ${{ always() }}
        run: echo "### Integration — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm security:audit
      - name: Scan repository for secrets
        run: pnpm security:secrets
      - name: Run security regression suite
        run: pnpm test:security
      - name: Summarize security gate
        if: ${{ always() }}
        run: echo "### Security — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configurations
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.observability.yaml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build web candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          load: true
          push: false
          provenance: false
          sbom: false
          tags: tripforge-ci-web:local
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=TripForge Web
          build-args: |
            NEXT_PUBLIC_API_URL=http://127.0.0.1:4000
            NEXT_PUBLIC_MAPTILER_KEY=ci-public-placeholder
            NEXT_PUBLIC_S3_UPLOAD_ORIGIN=http://127.0.0.1:4566
      - name: Build API candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/api.Dockerfile
          target: runtime
          load: true
          push: false
          provenance: false
          sbom: false
          tags: tripforge-ci-api:local
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=TripForge API
      - name: Build migration candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/api.Dockerfile
          target: migration
          load: true
          push: false
          provenance: false
          sbom: false
          tags: tripforge-ci-migrate:local
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=TripForge Migrate
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: false
      - name: Report all high and critical image findings
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 0 --format table tripforge-ci-web:local
          trivy image --severity HIGH,CRITICAL --exit-code 0 --format table tripforge-ci-api:local
          trivy image --severity HIGH,CRITICAL --exit-code 0 --format table tripforge-ci-migrate:local
      - name: Block fixable high and critical image findings
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table tripforge-ci-web:local
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table tripforge-ci-api:local
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table tripforge-ci-migrate:local
      - name: Smoke-test production containers
        run: scripts/ci/container-smoke.sh
      - name: Summarize Docker gate
        if: ${{ always() }}
        run: echo "### Docker build, Trivy, and smoke — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Initialize and validate bootstrap
        run: |
          terraform -chdir=infra/terraform/bootstrap init -backend=false
          terraform -chdir=infra/terraform/bootstrap validate
          terraform -chdir=infra/terraform/bootstrap test
      - name: Initialize and validate production
        run: |
          terraform -chdir=infra/terraform/production init -backend=false
          terraform -chdir=infra/terraform/production validate
          terraform -chdir=infra/terraform/production test
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: false
      - name: Block high and critical IaC findings
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 infra/terraform
      - name: Summarize infrastructure gate
        if: ${{ always() }}
        run: echo "### Terraform and IaC security — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  browser:
    name: Browser and bounded load
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Qualify real production-built browser workflows
        run: pnpm test:e2e
      - name: Install checksum-verified k6 2.3.0 and run bounded smoke
        run: |
          export K6_BINARY="$(node scripts/readiness/install-k6.mjs)"
          pnpm perf:load smoke
      - name: Upload browser failures only
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-failure-${{ github.sha }}
          path: test-results/
          retention-days: 7
      - name: Upload compact load summary without fixture/session data
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-smoke-${{ github.sha }}
          path: readiness-results/k6-smoke.json
          retention-days: 7

  gate:
    name: Gate
    if: ${{ always() }}
    needs:
      - quality
      - database
      - integration
      - security
      - docker
      - infrastructure
      - browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      DATABASE_RESULT: ${{ needs.database.result }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
      SECURITY_RESULT: ${{ needs.security.result }}
      DOCKER_RESULT: ${{ needs.docker.result }}
      INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
      BROWSER_RESULT: ${{ needs.browser.result }}
    steps:
      - name: Require every mandatory gate
        run: |
          for result in "$QUALITY_RESULT" "$DATABASE_RESULT" "$INTEGRATION_RESULT" "$SECURITY_RESULT" "$DOCKER_RESULT" "$INFRASTRUCTURE_RESULT" "$BROWSER_RESULT"; do
            test "$result" = success
          done
      - name: Summarize aggregate gate
        if: ${{ always() }}
        run: |
          {
            echo "### CI Gate — ${{ job.status }}"
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| Quality | $QUALITY_RESULT |"
            echo "| Database | $DATABASE_RESULT |"
            echo "| Integration | $INTEGRATION_RESULT |"
            echo "| Security | $SECURITY_RESULT |"
            echo "| Docker | $DOCKER_RESULT |"
            echo "| Infrastructure | $INFRASTRUCTURE_RESULT |"
            echo "| Browser and load | $BROWSER_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish GHCR images
    if: >-
      ${{ github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUBLIC_API_URL: ${{ vars.TRIPFORGE_PUBLIC_API_URL }}
      PUBLIC_MAPTILER_KEY: ${{ vars.TRIPFORGE_PUBLIC_MAPTILER_KEY }}
      PUBLIC_S3_UPLOAD_ORIGIN: ${{ vars.TRIPFORGE_PUBLIC_S3_UPLOAD_ORIGIN }}
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate delivery inputs
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test -n "$PUBLIC_API_URL"
          test -n "$PUBLIC_S3_UPLOAD_ORIGIN"
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          fi
      - name: Resolve lowercase image names
        id: images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${OWNER,,}"
          echo "web=ghcr.io/${owner}/tripforge-web" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/${owner}/tripforge-api" >> "$GITHUB_OUTPUT"
          echo "migrate=ghcr.io/${owner}/tripforge-migrate" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate web metadata
        id: meta-web
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.images.outputs.web }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=TripForge Web
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Generate API metadata
        id: meta-api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.images.outputs.api }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=TripForge API
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Generate migration metadata
        id: meta-migrate
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.images.outputs.migrate }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=TripForge Migrate
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push web image
        id: build-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PUBLIC_API_URL }}
            NEXT_PUBLIC_MAPTILER_KEY=${{ env.PUBLIC_MAPTILER_KEY }}
            NEXT_PUBLIC_S3_UPLOAD_ORIGIN=${{ env.PUBLIC_S3_UPLOAD_ORIGIN }}
      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/api.Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Build and push migration image
        id: build-migrate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/api.Dockerfile
          target: migration
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Attest web image with GitHub
        if: ${{ vars.ENABLE_GITHUB_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.web }}
          subject-digest: ${{ steps.build-web.outputs.digest }}
          push-to-registry: true
      - name: Attest API image with GitHub
        if: ${{ vars.ENABLE_GITHUB_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.api }}
          subject-digest: ${{ steps.build-api.outputs.digest }}
          push-to-registry: true
      - name: Attest migration image with GitHub
        if: ${{ vars.ENABLE_GITHUB_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.migrate }}
          subject-digest: ${{ steps.build-migrate.outputs.digest }}
          push-to-registry: true
      - name: Create delivery manifest and image-size summary
        env:
          COMMIT_SHA: ${{ github.sha }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          API_IMAGE: ${{ steps.images.outputs.api }}
          MIGRATE_IMAGE: ${{ steps.images.outputs.migrate }}
          WEB_DIGEST: ${{ steps.build-web.outputs.digest }}
          API_DIGEST: ${{ steps.build-api.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.build-migrate.outputs.digest }}
        run: |
          jq -n \
            --arg commit "$COMMIT_SHA" \
            --arg webImage "$WEB_IMAGE" --arg webDigest "$WEB_DIGEST" \
            --arg apiImage "$API_IMAGE" --arg apiDigest "$API_DIGEST" \
            --arg migrateImage "$MIGRATE_IMAGE" --arg migrateDigest "$MIGRATE_DIGEST" \
            '{commit: $commit, images: {web: {name: $webImage, digest: $webDigest}, api: {name: $apiImage, digest: $apiDigest}, migrate: {name: $migrateImage, digest: $migrateDigest}}}' \
            > delivery-manifest.json

          {
            echo "### Delivered OCI images"
            echo "| Image | Digest | Pulled platform size |"
            echo "| --- | --- | ---: |"
            for kind in WEB API MIGRATE; do
              image_var="${kind}_IMAGE"
              digest_var="${kind}_DIGEST"
              image="${!image_var}"
              digest="${!digest_var}"
              docker pull "${image}@${digest}" >/dev/null
              bytes="$(docker image inspect "${image}@${digest}" --format '{{.Size}}')"
              echo "| ${kind,,} | \`${digest}\` | $(numfmt --to=iec "$bytes") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload delivery manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivery-manifest-${{ github.sha }}
          path: delivery-manifest.json
          if-no-files-found: error
          retention-days: 14
