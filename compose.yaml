name: tripforge

services:
  web:
    image: tripforge-web:local
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
        NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
        NEXT_PUBLIC_S3_UPLOAD_ORIGIN: http://localhost:4566
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
      NEXT_PUBLIC_S3_UPLOAD_ORIGIN: http://localhost:4566
    ports:
      - "127.0.0.1:${TRIPFORGE_WEB_PORT:-3100}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then((response) => {
            if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: tripforge
      POSTGRES_PASSWORD: tripforge
      POSTGRES_DB: tripforge
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripforge -d tripforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.10.1-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  localstack:
    image: localstack/localstack:2026.08.3
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SERVICES: s3
      PERSISTENCE: "1"
      S3_BUCKET: tripforge-documents
      TRIPFORGE_WEB_ORIGIN: http://127.0.0.1:3100
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./docker/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:4566/_localstack/health |
          grep -Eq '"s3"[[:space:]]*:[[:space:]]*"(available|running)"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  migrate:
    image: tripforge-api-migrate:local
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: migration
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tripforge:tripforge@db:5432/tripforge
      WEB_ORIGIN: http://127.0.0.1:3100
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: tripforge-api:local
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://tripforge:tripforge@db:5432/tripforge
      WEB_ORIGIN: http://127.0.0.1:3100
      REDIS_URL: redis://redis:6379
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      S3_BUCKET: tripforge-documents
      S3_REGION: us-east-1
      S3_ENDPOINT: http://localstack:4566
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${TRIPFORGE_API_PORT:-4000}:4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:4000/health').then((response) => {
            if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: tripforge-api:local
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tripforge:tripforge@db:5432/tripforge
      REDIS_URL: redis://redis:6379
      S3_BUCKET: tripforge-documents
      S3_REGION: us-east-1
      S3_ENDPOINT: http://localstack:4566
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "dist/worker-health.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  localstack_data:
  postgres_data:
  redis_data:
