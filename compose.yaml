name: tripforge

services:
  web:
    image: tripforge-web:local
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
        NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
    ports:
      - "127.0.0.1:${TRIPFORGE_WEB_PORT:-3100}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then((response) => {
            if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: tripforge
      POSTGRES_PASSWORD: tripforge
      POSTGRES_DB: tripforge
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripforge -d tripforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: tripforge-api-migrate:local
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: migration
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tripforge:tripforge@db:5432/tripforge
      WEB_ORIGIN: http://127.0.0.1:3100
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: tripforge-api:local
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://tripforge:tripforge@db:5432/tripforge
      WEB_ORIGIN: http://127.0.0.1:3100
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${TRIPFORGE_API_PORT:-4000}:4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:4000/health').then((response) => {
            if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
